nodeVersion: 24.20.0
pmOnFail: warn
autoDedupe: true
packages:
  - 'bin'
  - 'ui/*'
  - 'ui/@types/*'
allowBuilds:
  esbuild: true
  protobufjs: false
overrides:
  fast-uri: 3.1.9
  undici: 8.12.2
  dompurify: 3.4.17
  js-yaml: 4.3.2
  source-map-js: 1.2.2
  uuid: 11.1.1
  "minimatch@>=7.0.0 <11.0.1": 11.0.1
patchedDependencies:
  '@toast-ui/editor@3.2.2': ui/bits/patches/@toast-ui__editor.patch
minimumReleaseAgeExclude:
  - '@lichess-org/*'
  - pnpm
  - '@pobammer-ts/small-rules'
ignoredOptionalDependencies:
  - '*arm-*'
  - '*ia32-*'
  - '*-ia32*'
  - '*loong64-*'
  - '*-loong64*'
  - '*mips64el-*'
  - '*-mips64el*'
  - '*ppc64-*'
  - '*-ppc64*'
  - '*riscv64-*'
  - '*-riscv64*'
  - '*s390x-*'
  - '*-s390x*'
  - '*aix-*'
  - '*-aix*'
  - '*android-*'
  - '*-android*'
  - '*freebsd-*'
  - '*-freebsd*'
  - '*openbsd-*'
  - '*-openbsd*'
  - '*openharmony-*'
  - '*-openharmony*'
  - '*netbsd-*'
  - '*-netbsd*'
  - '*sunos-*'
  - '*-sunos*'
