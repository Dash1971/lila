# Mute application files are unchanged; this is the sole #363 metadata exception.
# The companion snapshot supplies the adapter roster and puzzle validator only.
name: Mute native checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: lila
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Dash1971/mute-chess
          ref: 910c329fc79286162797e5908a57b2b3b3e97984
          path: mute-chess
      - name: Check the unchanged WebSocket patch
        run: |
          git init /tmp/lila-ws
          git -C /tmp/lila-ws fetch --depth=1 https://github.com/lichess-org/lila-ws.git 5089b84b5fe2da3f3e9e69d29363115cfddfc758
          git -C /tmp/lila-ws checkout --detach FETCH_HEAD
          git -C /tmp/lila-ws apply --check "$GITHUB_WORKSPACE/mute-chess/deploy/lila/patches/lila-ws-bind-address.patch"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - name: Native and adapter catalogs agree
        run: node mute-chess/lila-adapter/validate-catalog.mjs "$GITHUB_WORKSPACE/lila"
      - name: Build and test the native board and analysis extensions
        working-directory: lila
        run: |
          npm install --global pnpm@12.9.0
          pnpm install --frozen-lockfile
          (cd ui/.build && pnpm install --frozen-lockfile)
          node "$GITHUB_WORKSPACE/mute-chess/puzzles/validate.mjs" "$GITHUB_WORKSPACE/lila/node_modules/.pnpm/chessops@0.15.1/node_modules/chessops"
          node ui/test
          ./ui/build --no-install site lobby analyse round editor dasher puzzle bits learn coordinateTrainer storm user insight tournament

  native-forum:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: lila
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
          cache-dependency-path: |
            lila/build.sbt
            lila/project/*.scala
            lila/security-dependencies.sbt
      - uses: sbt/setup-sbt@f9efdb0d6d5959d3e1510935d4ff64a65821a256 # v1
      - name: Check native Scala formatting, GIF parsing, study plan, forum permissions and user search
        working-directory: lila
        run: sbt -J-Xms128m -J-Xmx3g -J-Xss2m -J-XX:ActiveProcessorCount=2 -Dsbt.task.cpus=2 -Dsbt.supershell=false 'scalafmtCheckAll;security/testOnly lila.security.ModeratorOAuthTest lila.security.PermissionTest;core/testOnly lila.core.NostrNameTest;game/testOnly lila.game.NoSweatAnalysisGifTest;game/testOnly lila.game.NoSweatGameAdmissionTest;game/testOnly lila.game.NoSweatArenaAdmissionTest;chat/testOnly lila.chat.ChatPublicNameTest;round/testOnly lila.round.NoSweatPresetChatTest;round/testOnly lila.round.NoSweatAbandonTest;i18n/testOnly lila.i18n.NoSweatLanguagesTest;web/testOnly lila.web.NoSweatBrandingTest;web/testOnly lila.markdown.MarkdownTest;relay/testOnly lila.relay.RelaySourceAddressTest lila.relay.RelayFetchTest;bot/testOnly lila.bot.PublicBotActivityTest;tournament/testOnly lila.tournament.NoSweatArenaTest;compile;testOnly lila.app.NoSweatArenaRosterTest lila.app.NoSweatSignupNameTest;testOnly lila.i18n.NoSweatArenaLocaleTest;forum/testOnly lila.forum.ForumAccessTest;user/testOnly lila.user.NoSweatUserSearchTest;user/testOnly lila.user.NoSweatPlayerRatingsTest;testOnly lila.app.NoSweatInsightsTest;testOnly lila.i18n.NoSweatInsightsLocaleTest;testOnly lila.app.NoSweatStudyPlanTest;testOnly lila.app.NoSweatBotCatalogTest;testOnly lila.app.NoSweatDonationTest;user/testOnly lila.user.NoSweatBotIdentityTest;user/testOnly lila.user.NoSweatNostrIdentityTest;user/testOnly lila.user.PublicNameKeysTest;user/testOnly lila.user.PublicNameTest'


